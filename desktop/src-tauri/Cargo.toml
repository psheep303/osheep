[package]
name = "osheep-desktop"
version = "0.2.1"
description = "The osheep desktop workbench"
authors = ["osheep"]
license = "MIT"
repository = "https://github.com/psheep303/osheep"
edition = "2021"

[lib]
name = "osheep_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rfd = "0.15"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
