<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Osheep</title>
    <script>
      var startupPreference = new URLSearchParams(window.location.search).get("osheepTheme");
      var startupTheme = startupPreference === "system"
        ? window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
        : startupPreference === "light" ? "light" : "dark";
      document.documentElement.dataset.theme = startupTheme;
      document.documentElement.style.colorScheme = startupTheme;
    </script>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #181818;
        color: #cccccc;
        font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      .startup {
        display: flex;
        align-items: center;
        flex-direction: column;
        gap: 18px;
      }
      .startup img { width: 72px; height: 72px; object-fit: contain; }
      .dots { display: flex; align-items: center; justify-content: center; gap: 7px; height: 8px; }
      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #75beff;
        opacity: 0.28;
        animation: pulse 1.2s ease-in-out infinite;
      }
      .dot:nth-child(2) { animation-delay: 0.16s; }
      .dot:nth-child(3) { animation-delay: 0.32s; }
      .error {
        display: none;
        max-width: min(480px, calc(100vw - 48px));
        color: #f48771;
        font-size: 14px;
        line-height: 1.6;
        text-align: center;
        white-space: pre-wrap;
      }
      :root[data-theme="light"] body { background: #f7f8fa; color: #26313d; }
      :root[data-theme="light"] .dot { background: #0078d4; }
      :root[data-theme="dark"] body { background: #181818; color: #cccccc; }
      :root[data-theme="dark"] .dot { background: #75beff; }
      @keyframes pulse {
        0%, 60%, 100% { opacity: 0.28; transform: scale(0.82); }
        30% { opacity: 1; transform: scale(1.16); }
      }
    </style>
  </head>
  <body>
    <div class="startup" id="startup" aria-hidden="true">
      <img src="osheep-icon.png" alt="" />
      <div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
    </div>
    <div class="error" id="error" role="alert"></div>
    <script>
      window.__osheepStartupError = function (message) {
        document.getElementById("startup").style.display = "none";
        var error = document.getElementById("error");
        error.style.display = "block";
        error.textContent = "启动失败: " + message + "\n请查看日志目录中的 backend.log，或重启应用重试。";
      };
    </script>
  </body>
</html>
