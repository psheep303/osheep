<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>前端直接调用测试</title>
</head>
<body>
  <h1>前端直接调用 API 测试</h1>
  <button onclick="testAPI()">测试 API</button>
  <pre id="output"></pre>

  <script>
    async function testAPI() {
      const output = document.getElementById('output');
      output.textContent = '测试�?..\n';

      const baseUrl = 'https://muyuan.do/v1';
      const apiKey = 'sk-REDACTED';

      try {
        output.textContent += '\n步骤 1: 获取模型列表...\n';
        const modelsRes = await fetch(`${baseUrl}/models`, {
          headers: {
            'Authorization': `Bearer ${apiKey}`,
          },
        });
        const modelsData = await modelsRes.json();
        output.textContent += `状�? ${modelsRes.status}\n`;
        output.textContent += `模型数量: ${modelsData.data?.length || 0}\n`;
        output.textContent += `�?�? ${modelsData.data?.slice(0, 3).map(m => m.id).join(', ')}\n`;

        output.textContent += '\n步骤 2: 测试聊天...\n';
        const chatRes = await fetch(`${baseUrl}/chat/completions`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`,
          },
          body: JSON.stringify({
            model: 'claude-opus-4-8',
            messages: [{ role: 'user', content: '用一句话介绍你自�? }],
          }),
        });
        const chatData = await chatRes.json();
        output.textContent += `状�? ${chatRes.status}\n`;
        if (chatRes.ok) {
          output.textContent += `�?成功！\n`;
          output.textContent += `回复: ${chatData.choices[0]?.message?.content || '(�?'}\n`;
        } else {
          output.textContent += `�?失败\n`;
          output.textContent += `错误: ${JSON.stringify(chatData, null, 2)}\n`;
        }

        output.textContent += '\n步骤 3: 测试流式聊天...\n';
        const streamRes = await fetch(`${baseUrl}/chat/completions`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`,
            'Accept': 'text/event-stream',
          },
          body: JSON.stringify({
            model: 'claude-opus-4-8',
            messages: [{ role: 'user', content: '说一句话' }],
            stream: true,
          }),
        });
        output.textContent += `状�? ${streamRes.status}\n`;

        if (streamRes.ok) {
          const reader = streamRes.body.getReader();
          const decoder = new TextDecoder();
          let content = '';

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            const chunk = decoder.decode(value, { stream: true });
            const lines = chunk.split('\n');

            for (const line of lines) {
              if (line.startsWith('data: ') && line !== 'data: [DONE]') {
                try {
                  const json = JSON.parse(line.slice(6));
                  const delta = json.choices?.[0]?.delta?.content;
                  if (delta) content += delta;
                } catch {}
              }
            }
          }

          output.textContent += `�?流式成功！\n`;
          output.textContent += `内容: ${content}\n`;
        } else {
          const text = await streamRes.text();
          output.textContent += `�?流式失败\n`;
          output.textContent += `错误: ${text}\n`;
        }

      } catch (e) {
        output.textContent += `\n异常: ${e.message}\n`;
      }
    }
  </script>
</body>
</html>
