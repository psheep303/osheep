<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Osheep workbench</title>
    <script>
      (() => {
        try {
          const raw = localStorage.getItem("osheep.uiPreferences.v1");
          const preference = raw ? JSON.parse(raw).theme : null;
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          const theme = preference === "dark" || (preference !== "light" && prefersDark) ? "dark" : "light";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch {
          // The React preference provider will recover if storage is unavailable or malformed.
        }
      })();

      if (new URLSearchParams(window.location.search).has("osheepDesktop")) {
        document.documentElement.dataset.desktopNavigation = "true";
      }
    </script>
    <style>
      :root {
        color-scheme: light;
        --startup-bg: #f7f8fa;
        --startup-fg: #26313d;
        --startup-accent: #0078d4;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --startup-bg: #181818;
          --startup-fg: #d7d7d7;
          --startup-accent: #75beff;
        }
      }

      :root[data-theme="light"] {
        color-scheme: light;
        --startup-bg: #f7f8fa;
        --startup-fg: #26313d;
        --startup-accent: #0078d4;
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
        --startup-bg: #181818;
        --startup-fg: #d7d7d7;
        --startup-accent: #75beff;
      }

      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
      }

      body {
        background: var(--startup-bg);
        color: var(--startup-fg);
      }

      #startup-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: var(--startup-bg);
      }

      .startup-splash__mark {
        display: flex;
        align-items: center;
        flex-direction: column;
        gap: 18px;
      }

      :root[data-desktop-navigation="true"] #startup-splash {
        display: none;
      }

      .startup-splash__mark img {
        width: 72px;
        height: 72px;
        object-fit: contain;
      }

      .startup-splash__dots {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        height: 8px;
      }

      .startup-splash__dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--startup-accent);
        opacity: 0.28;
        animation: startup-splash-dot 1.2s ease-in-out infinite;
      }

      .startup-splash__dot:nth-child(2) {
        animation-delay: 0.16s;
      }

      .startup-splash__dot:nth-child(3) {
        animation-delay: 0.32s;
      }

      @keyframes startup-splash-dot {
        0%,
        60%,
        100% {
          opacity: 0.28;
          transform: scale(0.82);
        }

        30% {
          opacity: 1;
          transform: scale(1.16);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .startup-splash__dot {
          animation-duration: 2.4s;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="startup-splash" aria-hidden="true">
        <div class="startup-splash__mark">
          <img src="/osheep-icon.png" alt="" />
          <div class="startup-splash__dots">
            <span class="startup-splash__dot"></span>
            <span class="startup-splash__dot"></span>
            <span class="startup-splash__dot"></span>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
