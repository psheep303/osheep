[workspace]
resolver = "2"
members = [
  "crates/osheep-contract",
  "crates/osheep-core",
  "crates/osheep-instance",
  "crates/osheep-pty",
  "crates/osheep-server",
  "desktop/src-tauri",
]
default-members = [
  "crates/osheep-contract",
  "crates/osheep-core",
  "crates/osheep-instance",
  "crates/osheep-pty",
  "crates/osheep-server",
]

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/psheep303/osheep"

[workspace.dependencies]
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
libc = "0.2"
mime_guess = "2"
percent-encoding = "2"
portable-pty = "0.8.1"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
